  ja:
    title: "PDFチケットをウォレットに – Apple・Google ウォレットの代わりに"
    description: "Apple ウォレットや Google ウォレットには PDF チケットを保存できません。PDFWallet なら PDF チケット、搭乗券、QR コードをスマホにオフラインで保存できます。無料・広告なし。"
    h1: "PDFチケットが Apple・Google ウォレットに追加できない？"
    intro: "Apple ウォレットは .pkpass ファイルのみ、Google ウォレットは発行元が提供するパスのみに対応しています。多くの航空会社、鉄道会社、チケットショップは PDF しか送ってくれません。PDFWallet はそんな PDF のためのウォレットです。"
    steps_title: "PDFチケットをウォレットに入れる方法"
    steps:
      - ["PDFを開く", "メール、ブラウザ、またはファイルアプリから PDF を開きます。"]
      - ["PDFWallet に共有", "共有をタップして PDFWallet を選ぶか、アプリ内でインポートします。複数ファイルの同時インポートも可能です。"]
      - ["コードを表示", "バーコードは自動で検出されます。タップすると、搭乗口、入場口、レジで全画面表示できます。"]
    sections:
      - ["ファイルに PDF を置いておくだけではダメ？", "搭乗口でダウンロードの中から PDF を探すのはストレスです。PDFWallet ならすべてのチケットを好きな順番で一か所にまとめ、バーコードを全画面表示して数秒で読み取れます。"]
      - ["インターネット不要", "すべて端末内に保存されます。機内モードでも、海外でも、地下でもチケットを開けます。書類がスマホの外に出ることはありません。"]
    faq:
      - ["PDF を Apple ウォレットに追加できますか？", "直接はできません。Apple ウォレットは .pkpass ファイルのみ対応です。PDFWallet は PDF そのものを保存し、QR コードやバーコードを全画面表示します。"]
      - ["PDF を Google ウォレットに追加できますか？", "Google ウォレットは任意の PDF チケットを取り込めません。PDFWallet なら、どんな PDF チケットも Android スマホに保存してオフラインで表示できます。"]
      - ["PDFWallet は無料ですか？", "はい。PDF の表示、バーコードの全画面表示、並べ替えは無料です。サブスクリプションなしの買い切りで追加機能が使えます。"]
  ko:
    title: "PDF 티켓을 월렛에 – Apple·Google 월렛의 대안"
    description: "Apple 월렛과 Google 월렛은 PDF 티켓을 저장할 수 없습니다. PDFWallet은 PDF 티켓, 탑승권, QR 코드를 휴대폰에 오프라인으로 보관합니다. 무료, 광고 없음."
    h1: "PDF 티켓이 Apple 또는 Google 월렛에 추가되지 않나요?"
    intro: "Apple 월렛은 .pkpass 파일만, Google 월렛은 제공업체가 발급한 패스만 지원합니다. 많은 항공사, 철도 회사, 티켓 판매처는 PDF만 보내줍니다. PDFWallet은 바로 그런 PDF를 위한 월렛입니다."
    steps_title: "PDF 티켓을 월렛에 넣는 방법"
    steps:
      - ["PDF 열기", "이메일, 브라우저 또는 파일 앱에서 PDF를 엽니다."]
      - ["PDFWallet로 공유", "공유를 탭하고 PDFWallet을 선택하거나 앱 안에서 가져옵니다. 여러 파일을 한 번에 가져올 수도 있습니다."]
      - ["코드 보여주기", "바코드는 자동으로 감지됩니다. 탭하면 탑승구, 입구, 계산대에서 전체 화면으로 보여줄 수 있습니다."]
    sections:
      - ["그냥 파일에 PDF를 두면 안 되나요?", "탑승구에서 다운로드 폴더를 뒤져 PDF를 찾는 건 스트레스입니다. PDFWallet은 모든 티켓을 원하는 순서로 한곳에 모아 두고, 바코드를 전체 화면으로 보여줘 몇 초 만에 스캔됩니다."]
      - ["인터넷 없이 작동", "모든 것이 기기에 저장됩니다. 비행기 모드, 해외, 지하에서도 티켓이 열리며 문서는 휴대폰 밖으로 나가지 않습니다."]
    faq:
      - ["PDF를 Apple 월렛에 추가할 수 있나요?", "직접은 불가능합니다. Apple 월렛은 .pkpass 파일만 지원합니다. PDFWallet은 PDF 자체를 저장하고 QR 코드나 바코드를 전체 화면으로 보여줍니다."]
      - ["PDF를 Google 월렛에 추가할 수 있나요?", "Google 월렛은 임의의 PDF 티켓을 가져오지 않습니다. PDFWallet을 사용하면 어떤 PDF 티켓이든 Android 휴대폰에 보관하고 오프라인으로 보여줄 수 있습니다."]
      - ["PDFWallet은 무료인가요?", "네. PDF 보기, 바코드 전체 화면 표시, 정렬은 무료입니다. 구독 없는 일회성 구매로 추가 기능을 사용할 수 있습니다."]
