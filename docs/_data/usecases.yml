pdf-to-wallet:
  en:
    title: "Add a PDF ticket to your wallet – the Apple & Google Wallet alternative"
    description: "Apple Wallet and Google Wallet can't store PDF tickets. PDFWallet keeps your PDF tickets, boarding passes and QR codes on your phone – offline, free, no ads."
    h1: "Your PDF ticket won't go into Apple or Google Wallet?"
    intro: "Apple Wallet only accepts .pkpass files, and Google Wallet only supports passes issued by the provider. Many airlines, rail operators and ticket shops just send a PDF. PDFWallet is a wallet built for exactly those PDFs."
    steps_title: "How to put a PDF ticket in a wallet"
    steps:
      - ["Open the PDF", "Open the PDF from your email, browser or files app."]
      - ["Share it to PDFWallet", "Tap share and choose PDFWallet – or import it inside the app. Several files at once work too."]
      - ["Show the code", "Barcodes are detected automatically. Tap one to show it fullscreen at the gate, the entrance or the checkout."]
    sections:
      - ["Why not just keep the PDF in my files?", "Finding a PDF in your downloads at the gate is stressful. PDFWallet keeps all tickets in one place, sorted your way, and shows the barcode fullscreen so scanners read it in seconds."]
      - ["Works without internet", "Everything is stored on your device. Your tickets open even in flight mode, abroad or underground – and your documents never leave your phone."]
    faq:
      - ["Can I add a PDF to Apple Wallet?", "Not directly. Apple Wallet only supports .pkpass files. PDFWallet stores the PDF itself and shows its QR code or barcode fullscreen."]
      - ["Can I add a PDF to Google Wallet?", "Google Wallet doesn't import arbitrary PDF tickets. With PDFWallet you can keep any PDF ticket on your Android phone and show it offline."]
      - ["Is PDFWallet free?", "Yes. Viewing PDFs, fullscreen barcodes and sorting are free. A one-time purchase, no subscription, unlocks additional features."]
  de:
    title: "PDF-Ticket in die Wallet – die Alternative zu Apple & Google Wallet"
    description: "Apple Wallet und Google Wallet können keine PDF-Tickets speichern. PDFWallet speichert PDF-Tickets, Bordkarten und QR-Codes offline auf dem Handy – kostenlos, ohne Werbung."
    h1: "Dein PDF-Ticket lässt sich nicht zur Apple oder Google Wallet hinzufügen?"
    intro: "Apple Wallet akzeptiert nur .pkpass-Dateien, Google Wallet nur Pässe des Anbieters. Viele Airlines, Bahnen und Ticketshops verschicken aber nur ein PDF. PDFWallet ist die Wallet für genau diese PDFs."
    steps_title: "So kommt ein PDF-Ticket in die Wallet"
    steps:
      - ["PDF öffnen", "Öffne das PDF aus deiner E-Mail, dem Browser oder der Dateien-App."]
      - ["An PDFWallet teilen", "Tippe auf Teilen und wähle PDFWallet – oder importiere es direkt in der App. Auch mehrere Dateien gleichzeitig."]
      - ["Code anzeigen", "Barcodes werden automatisch erkannt. Tippe darauf, um sie am Gate, Einlass oder an der Kasse im Vollbild zu zeigen."]
    sections:
      - ["Warum nicht einfach in den Downloads lassen?", "Ein PDF am Gate in den Downloads zu suchen, ist stressig. PDFWallet hält alle Tickets an einem Ort, sortiert nach deinen Wünschen, und zeigt den Barcode im Vollbild – in Sekunden gescannt."]
      - ["Funktioniert ohne Internet", "Alles wird auf deinem Gerät gespeichert. Tickets öffnen sich auch im Flugmodus, im Ausland oder im Tunnel – und deine Dokumente verlassen nie dein Handy."]
    faq:
      - ["Kann ich ein PDF zur Apple Wallet hinzufügen?", "Nicht direkt. Apple Wallet unterstützt nur .pkpass-Dateien. PDFWallet speichert das PDF selbst und zeigt den QR-Code oder Barcode im Vollbild."]
      - ["Kann ich ein PDF zur Google Wallet hinzufügen?", "Google Wallet importiert keine beliebigen PDF-Tickets. Mit PDFWallet speicherst du jedes PDF-Ticket auf deinem Android-Handy und zeigst es offline."]
      - ["Ist PDFWallet kostenlos?", "Ja. PDFs ansehen, Barcodes im Vollbild und Sortieren sind kostenlos. Ein einmaliger Kauf, kein Abo, schaltet weitere Funktionen frei."]
  es:
    title: "Añade un billete PDF a tu wallet – la alternativa a Apple y Google Wallet"
    description: "Apple Wallet y Google Wallet no pueden guardar billetes en PDF. PDFWallet guarda tus billetes PDF, tarjetas de embarque y códigos QR en tu móvil – sin conexión, gratis y sin anuncios."
    h1: "¿Tu billete PDF no se puede añadir a Apple o Google Wallet?"
    intro: "Apple Wallet solo acepta archivos .pkpass y Google Wallet solo admite pases emitidos por el proveedor. Muchas aerolíneas, operadores ferroviarios y ticketeras solo envían un PDF. PDFWallet es una wallet creada justo para esos PDF."
    steps_title: "Cómo poner un billete PDF en una wallet"
    steps:
      - ["Abre el PDF", "Abre el PDF desde tu correo, el navegador o la app de archivos."]
      - ["Compártelo con PDFWallet", "Toca compartir y elige PDFWallet – o impórtalo dentro de la app. También funciona con varios archivos a la vez."]
      - ["Muestra el código", "Los códigos de barras se detectan automáticamente. Toca uno para mostrarlo a pantalla completa en la puerta de embarque, la entrada o la caja."]
    sections:
      - ["¿Por qué no dejar el PDF en mis archivos?", "Buscar un PDF entre tus descargas en la puerta de embarque es estresante. PDFWallet guarda todos los billetes en un solo lugar, ordenados a tu manera, y muestra el código a pantalla completa para que se escanee en segundos."]
      - ["Funciona sin internet", "Todo se guarda en tu dispositivo. Tus billetes se abren incluso en modo avión, en el extranjero o bajo tierra – y tus documentos nunca salen de tu móvil."]
    faq:
      - ["¿Puedo añadir un PDF a Apple Wallet?", "No directamente. Apple Wallet solo admite archivos .pkpass. PDFWallet guarda el propio PDF y muestra su código QR o de barras a pantalla completa."]
      - ["¿Puedo añadir un PDF a Google Wallet?", "Google Wallet no importa cualquier billete PDF. Con PDFWallet puedes guardar cualquier billete PDF en tu Android y mostrarlo sin conexión."]
      - ["¿PDFWallet es gratis?", "Sí. Ver PDF, los códigos a pantalla completa y la ordenación son gratis. Una compra única, sin suscripción, desbloquea funciones adicionales."]
  fr:
    title: "Ajouter un billet PDF à votre wallet – l'alternative à Apple et Google Wallet"
    description: "Apple Wallet et Google Wallet ne peuvent pas stocker de billets PDF. PDFWallet garde vos billets PDF, cartes d'embarquement et QR codes sur votre téléphone – hors ligne, gratuit, sans publicité."
    h1: "Votre billet PDF ne s'ajoute pas à Apple ou Google Wallet ?"
    intro: "Apple Wallet n'accepte que les fichiers .pkpass et Google Wallet ne prend en charge que les cartes émises par le fournisseur. Beaucoup de compagnies aériennes, d'opérateurs ferroviaires et de billetteries envoient simplement un PDF. PDFWallet est un wallet conçu exactement pour ces PDF."
    steps_title: "Comment mettre un billet PDF dans un wallet"
    steps:
      - ["Ouvrez le PDF", "Ouvrez le PDF depuis votre e-mail, votre navigateur ou l'app Fichiers."]
      - ["Partagez-le avec PDFWallet", "Touchez Partager et choisissez PDFWallet – ou importez-le dans l'app. Plusieurs fichiers à la fois, c'est possible aussi."]
      - ["Affichez le code", "Les codes-barres sont détectés automatiquement. Touchez-en un pour l'afficher en plein écran à la porte d'embarquement, à l'entrée ou à la caisse."]
    sections:
      - ["Pourquoi ne pas laisser le PDF dans mes fichiers ?", "Chercher un PDF dans ses téléchargements à la porte d'embarquement est stressant. PDFWallet réunit tous vos billets au même endroit, triés comme vous le souhaitez, et affiche le code-barres en plein écran pour un scan en quelques secondes."]
      - ["Fonctionne sans internet", "Tout est stocké sur votre appareil. Vos billets s'ouvrent même en mode avion, à l'étranger ou dans le métro – et vos documents ne quittent jamais votre téléphone."]
    faq:
      - ["Puis-je ajouter un PDF à Apple Wallet ?", "Pas directement. Apple Wallet ne prend en charge que les fichiers .pkpass. PDFWallet stocke le PDF lui-même et affiche son QR code ou code-barres en plein écran."]
      - ["Puis-je ajouter un PDF à Google Wallet ?", "Google Wallet n'importe pas n'importe quel billet PDF. Avec PDFWallet, vous gardez tout billet PDF sur votre téléphone Android et l'affichez hors ligne."]
      - ["PDFWallet est-il gratuit ?", "Oui. L'affichage des PDF, les codes-barres en plein écran et le tri sont gratuits. Un achat unique, sans abonnement, débloque des fonctionnalités supplémentaires."]
