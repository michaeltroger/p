    - ["🔒", "Private by design", "Works offline, with no ads and no tracking. Your documents never leave your device."]
    - ["📱", "Fullscreen barcodes", "Show QR, Aztec, DataMatrix, PDF417 and 1D barcodes fullscreen – scanned in seconds."]
    - ["📄", "Crisp PDF viewing", "View your PDFs in high quality, even without an internet connection."]
    - ["🏷️", "Tags & sorting", "Organize with tags, sort, drag & drop to reorder, switch between list and grid, and share or delete in bulk."]
    - ["🌙", "Dark mode", "Beautiful in dark mode – keep documents in their original colors or invert them."]
    - ["👆", "Biometric lock", "Optionally protect your wallet with Face ID or fingerprint authentication."]
    - ["📥", "Import in one tap", "Share PDFs from email, your browser or files straight into PDFWallet – several at once."]
    - ["🔍", "Find it fast", "Search by name and filter by tag or by documents with barcodes."]
    - ["👉", "Swipe between passes", "Swipe through pages and documents – ideal for group travel."]
  barcodes_title: "Supported barcodes"
  screenshots_title: "Screenshots"
  shots: ["All your tickets & passes in one wallet", "Show barcodes full screen, scan in seconds", "Crisp PDF viewing, even offline", "Organize documents with tags", "Sort your documents your way", "Scan-ready QR codes, day or night"]
  pricing: "Core features like viewing PDFs, fullscreen barcodes and sorting are free. A one-time in-app purchase – no subscription – unlocks all additional functionality."
  privacy_title: "Privacy"
  privacy_text: "This app operates entirely on your device."
  developed_in_eu: "🇪🇺 Developed in the EU."
  privacy_link: "Read our Privacy Policy"
  privacy_url: "/en/privacy/"
  imprint: "Imprint"
  privacy_policy: "Privacy Policy"
  contact_title: "Contact"
  contact_text: "Questions, feedback or ideas? Get in touch."
  contact_button: "Send an email"
  faq_title: "Frequently asked questions"
  faq:
    - ["Is PDFWallet free?", "Yes. Core features like viewing PDFs, fullscreen barcodes and sorting are free, with no ads. A one-time in-app purchase – no subscription – unlocks all additional functionality."]
    - ["Does PDFWallet work offline?", "Yes. All documents are stored on your device, so your tickets and barcodes are available even without an internet connection."]
    - ["Which barcodes are supported?", "QR, Aztec, DataMatrix, PDF417 and common 1D barcodes such as EAN, UPC, Code 39, Code 93, Code 128, ITF and Codabar."]
