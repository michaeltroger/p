  faq_title: "الأسئلة الشائعة"
  faq:
    - ["هل PDFWallet مجاني؟", "نعم. الميزات الأساسية مثل عرض PDF والباركود بملء الشاشة والترتيب مجانية ودون إعلانات. يفتح شراء لمرة واحدة داخل التطبيق، دون اشتراك، جميع الميزات الإضافية."]
    - ["هل يعمل PDFWallet دون اتصال بالإنترنت؟", "نعم. تُحفظ جميع المستندات على جهازك، لذا تبقى تذاكرك ورموزك الشريطية متاحة حتى دون اتصال بالإنترنت."]
    - ["ما الرموز الشريطية المدعومة؟", "QR وAztec وDataMatrix وPDF417 والرموز الشريطية أحادية البعد الشائعة مثل EAN وUPC وCode 39 وCode 93 وCode 128 وITF وCodabar."]
    - ["هل تُرفع مستنداتي إلى أي مكان؟", "لا. يعمل التطبيق بالكامل على جهازك دون أي تتبع. ويمكنك حمايته اختياريًا باستخدام Face ID أو بصمة الإصبع."]
    - ["ما المنصات المدعومة؟", "يتوفر PDFWallet لأجهزة iPhone وiPad وMac على App Store ولأجهزة Android على Google Play."]
